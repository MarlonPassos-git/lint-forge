allowBuilds: {}
blockExoticSubdeps: true
minimumReleaseAge: 43200
minimumReleaseAgeExclude:
  - nanoid@3.3.18
  # Renovate security update: vitest@4.1.11
  - vitest@4.1.11
  # Renovate security update: pnpm@10.34.5
  - pnpm@10.34.5
  # Renovate security update: undici@7.29.1
  - undici@7.29.1
overrides:
  nanoid@^3.3.0: 3.3.18
  postcss@^8.5.0: 8.5.23
  undici@^7.0.0: 7.29.1
  vite@^6.0.0: 6.4.3
trustPolicy: no-downgrade
# Renovate regenerates the lockfile on any dependency PR. Old transitive
# releases (tinyexec@1.2.2, semver@6.3.1) have weaker trust evidence than their
# predecessors and would otherwise block that artifact update forever, so keep
# the no-downgrade check only for packages inside the release-age window.
trustPolicyIgnoreAfter: 43200
